    applicationSubmittedAt: null,
    decisionAt: null,
    affiliateUrl: null,
    commissionModel: "N/A",
    cookieWindow: null,
    evidence: ["https://calendly.com/partners/contact — Calendly states it does not currently have an affiliate, referral, or reseller partner program"],
    ownerBlocker: null,
    formBlocker: null,
    eligibility: "No current affiliate/referral/reseller program",
    applicationUrl: null,
    notes: "Do not send owner to PartnerStack or another network for Calendly unless Calendly publishes a new program."
  },
  {
    programId: "coda-affiliate",
    programName: "Coda / Superhuman Docs Affiliate Program",
    network: "Historical PartnerStack; future Superhuman program on Impact",
