      "https://quickbooks.intuit.com/learn-support/en-us/help-article/small-business/promote-sell-quickbooks-quickbooks-business/L1WmCWEMR_US_en_US — current Intuit documentation states publishers use the QuickBooks Commission Junction Program",
      "https://1password.com/affiliate — current 1Password publisher path uses CJ"
    ],
    ownerBlocker: "Two distinct CJ publisher CIDs are evidenced. Reconcile them only if Miloosh chooses to pursue current CJ-required publishers such as 1Password or QuickBooks; do not create a third account.",
    formBlocker: null,
    eligibility: "Optional network; no currently active Miloosh affiliate depends on CJ",
    applicationUrl: "https://members.cj.com/",
    notes: "CJ is intentionally isolated from the 19 active-partner payout rails. Do not treat historical Dashlane/Google/Acuity/Evernote planning claims as current advertiser relationships without live CJ evidence."
