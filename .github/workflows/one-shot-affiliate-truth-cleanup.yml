name: One-shot affiliate truth cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-affiliate-truth-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove temporary normalization and reconcile stale docs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Raw canonical ledger is now repaired. Remove the temporary
          # normalization layer so reports again consume one source of truth.
          ledger = Path('scripts/affiliate/ledger.ts')
          text = ledger.read_text()
          text = text.replace(
              'import { CANONICAL_AFFILIATE_LEDGER, type AffiliateProgramRelationship, type CanonicalLedgerStatus } from "@/data/affiliate/canonical-ledger";',
              'import { CANONICAL_AFFILIATE_LEDGER, type CanonicalLedgerStatus } from "@/data/affiliate/canonical-ledger";'
          )
          start_marker = '/**\n * Effective ledger view for operational reports.'
          start = text.find(start_marker)
          iface = text.find('export interface LedgerSummaryReport', start)
          if start == -1 or iface == -1:
              raise SystemExit('Refusing cleanup: temporary Freshworks normalization block not found exactly once')
          text = text[:start] + text[iface:]
          old = '  const ledger = getEffectiveCanonicalAffiliateLedger();'
          if text.count(old) != 1:
              raise SystemExit(f'Refusing cleanup: expected one effective-ledger call, found {text.count(old)}')
          text = text.replace(old, '  const ledger = CANONICAL_AFFILIATE_LEDGER;', 1)
          ledger.write_text(text)

          # 2) Evidence file still described the now-completed surgical edit as pending.
          evidence = Path('data/affiliate/FIRST_PARTY_SIGNALS_2026-08-24.md')
          text = evidence.read_text()
          stale = ('The oversized raw record in `data/affiliate/canonical-ledger.ts` still contains the accidental enum/date mutation and requires a surgical source edit; '
                   'do not treat that raw three-field contradiction as vendor evidence. No derived engine should promote it over the actual first-party evidence.')
          fresh = ('The raw canonical record was surgically repaired by commit `f406aad69d53bd18a8dd79781a702cca2d571bd2`: '
                   '`status=PENDING_REVIEW`, `statusUpdatedAt=2026-08-20`, and `decisionAt=null`. The temporary one-shot workflow deleted itself after targeted affiliate-integrity tests and TypeScript verification passed. Freshworks now has one consistent source-of-truth state.')
          if text.count(stale) != 1:
              raise SystemExit(f'Refusing cleanup: stale Freshworks evidence paragraph count={text.count(stale)}')
          evidence.write_text(text.replace(stale, fresh, 1))

          # 3) Operational application doc still listed Close as PENDING.
          doc = Path('docs/affiliate-applications.md')
          lines = doc.read_text().splitlines()
          close_indexes = [i for i, line in enumerate(lines) if line.startswith('| Close | PartnerStack |')]
          if len(close_indexes) != 1:
              raise SystemExit(f'Refusing cleanup: expected exactly one Close table row, found {len(close_indexes)}')
          i = close_indexes[0]
          if '| PENDING |' not in lines[i]:
              raise SystemExit('Refusing cleanup: Close row is no longer the known stale PENDING row')
          lines[i] = ('| Close | PartnerStack | ACTIVE | Approved relationship with exact referral URL '
                      '`https://refer.close.com/0alqdg4so8rm`; URL was owner-verified on 2026-08-21 and re-confirmed in a first-party Close/PartnerStack email from Michael Taylor on 2026-08-24. '
                      '| Link active in canonical registry; monitor real clicks/referrals separately from QA traffic |')
          if lines and lines[2].startswith('Updated: 2026-08-24'):
              lines[2] = 'Updated: 2026-08-24 (Freshworks restored to evidence-backed PENDING_REVIEW; Close reconciled to ACTIVE with exact first-party-confirmed referral URL; Help Scout and ClickUp remain REJECTED.)'
          doc.write_text('\n'.join(lines) + '\n')
          PY

          git diff --check
          git diff -- scripts/affiliate/ledger.ts data/affiliate/FIRST_PARTY_SIGNALS_2026-08-24.md docs/affiliate-applications.md

      - name: Install dependencies
        run: npm ci

      - name: Run affiliate truth tests
        run: npx vitest run tests/lib/affiliate-integrity.test.ts tests/lib/canonical-affiliate-reconciliation-current-truth.test.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/one-shot-affiliate-truth-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/affiliate/ledger.ts data/affiliate/FIRST_PARTY_SIGNALS_2026-08-24.md docs/affiliate-applications.md .github/workflows/one-shot-affiliate-truth-cleanup.yml
          git commit -m "fix: collapse affiliate reporting back to canonical truth"
          git push origin HEAD:main
