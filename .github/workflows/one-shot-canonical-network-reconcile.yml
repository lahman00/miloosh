name: One-shot canonical affiliate network reconciliation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-canonical-network-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reconcile canonical network truth
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('data/affiliate/canonical-ledger.ts')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          old_cj = '''  {
    programId: "cj-portfolio",
    programName: "Commission Junction (CJ) Publisher Account",
    network: "Commission Junction (CJ)",
    productSlugs: ["1password", "dashlane", "acuity-scheduling", "google-meet", "google-chat", "evernote"],
    status: "OWNER_ACTION_REQUIRED",
    statusUpdatedAt: "2026-08-24",
    applicationSubmittedAt: null,
    decisionAt: null,
