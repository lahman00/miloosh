name: Verify npm audit remediation

on:
  push:
    branches:
      - security/npm-audit-remediation-20260924
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Validate data
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Generate safe audit-fix lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Guard remediation scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "package-lock.json" ]; then
            echo "Unexpected files changed:"
            echo "$changed"
            exit 1
          fi

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Commit lockfile candidate
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: remediate npm audit findings"
          git push origin HEAD:security/npm-audit-remediation-20260924
