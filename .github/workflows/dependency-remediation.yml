name: One-time dependency remediation

on:
  push:
    branches:
      - autonomous/npm-audit-remediation-2026-08-25
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v7
        with:
          ref: autonomous/npm-audit-remediation-2026-08-25

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Upgrade Next.js within the current major
        run: npm install next@16.3.2 eslint-config-next@16.3.2 --save-exact

      - name: Apply non-breaking audit fixes to the lockfile
        run: npm audit fix --package-lock-only

      - name: Reinstall exactly from remediated lockfile
        run: npm ci

      - name: Keep affiliate regression tests compatible with stricter build-time inference
        run: |
          python - <<'PY'
          from pathlib import Path

          edits = {
            'tests/lib/affiliate-money-matrix-readiness.test.ts': [
              ('rail.partnerSlugs.map((slug) => [slug, rail.readiness] as const)', 'rail.partnerSlugs.map((slug) => [String(slug), rail.readiness] as const)'),
            ],
            'tests/lib/affiliate-tracking-params.test.ts': [
              ('    for (const partner of ACTIVE_PARTNERS) {\n      const original = new URL(partner.affiliateUrl);', '    for (const partner of ACTIVE_PARTNERS) {\n      expect(partner.affiliateUrl, `${partner.slug} must have an active affiliate URL`).toBeTruthy();\n      if (!partner.affiliateUrl) continue;\n      const original = new URL(partner.affiliateUrl);'),
            ],
            'tests/lib/inbound-affiliate-opportunities.test.ts': [
              ('expect(ACTIVE_PARTNERS.some((partner) => partner.slug === "buddy-punch")).toBe(false);', 'expect(ACTIVE_PARTNERS.some((partner) => String(partner.slug) === "buddy-punch")).toBe(false);'),
              ('expect(ACTIVE_PARTNERS.some((partner) => partner.slug === "trainual")).toBe(false);', 'expect(ACTIVE_PARTNERS.some((partner) => String(partner.slug) === "trainual")).toBe(false);'),
            ],
          }

          for filename, replacements in edits.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in replacements:
              if old not in text:
                raise SystemExit(f'Expected compatibility anchor missing in {filename}; refusing blind edit')
              text = text.replace(old, new, 1)
            path.write_text(text)
          PY

      - name: Require a clean moderate-or-higher audit
        run: npm audit --audit-level=moderate

      - name: Tests
        run: npm test

      - name: Validate data
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit dependency remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tests/lib/affiliate-money-matrix-readiness.test.ts tests/lib/affiliate-tracking-params.test.ts tests/lib/inbound-affiliate-opportunities.test.ts
          if git diff --cached --quiet; then
            echo "No dependency changes were required."
            exit 0
          fi
          git commit -m "security: remediate npm audit findings"
          git push origin HEAD:autonomous/npm-audit-remediation-2026-08-25
