          git diff --check

      - run: npm ci
      - run: npm run validate:data
      - run: npx vitest run tests/lib/affiliate-integrity.test.ts tests/lib/canonical-affiliate-reconciliation-current-truth.test.ts tests/lib/owner-payout-actions.test.ts tests/lib/payout-rails.test.ts
      - run: npx tsc --noEmit

      - name: Commit reconciled ledger and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-canonical-network-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/affiliate/canonical-ledger.ts .github/workflows/one-shot-canonical-network-reconcile.yml
          git commit -m "fix: reconcile current affiliate network truth"
          git pull --rebase origin main
          git push origin HEAD:main
