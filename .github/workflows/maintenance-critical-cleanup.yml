name: One-time maintenance critical cleanup

on:
  push:
    branches:
      - autonomous/maintenance-critical-cleanup-2026-08-25
    paths:
      - .github/workflows/maintenance-critical-cleanup.yml
      - .github/scripts/maintenance-critical-cleanup.py

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: autonomous/maintenance-critical-cleanup-2026-08-25
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python .github/scripts/maintenance-critical-cleanup.py
      - run: npm test
      - run: npm run validate:data
      - run: npm run lint
      - run: npm run build
      - run: npm run maintenance
      - name: Print maintenance critical findings
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('./var/maintenance/latest-summary.json','utf8'));
          console.log(`critical=${s.totalCritical} warning=${s.totalWarning} info=${s.totalInfo}`);
          for (const a of s.agents.filter(x=>x.criticalCount>0)) {
            console.log(`CRITICAL_AGENT ${a.agent}: ${a.criticalCount}`);
            const file=`./var/maintenance/${a.agent}.json`;
            if (!fs.existsSync(file)) continue;
            const r=JSON.parse(fs.readFileSync(file,'utf8'));
            for (const i of r.issues.filter(x=>x.severity==='critical')) console.log(JSON.stringify(i));
          }
          NODE
