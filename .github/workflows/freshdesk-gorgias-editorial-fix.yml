name: One-time Freshdesk Gorgias editorial fix

on:
  push:
    branches:
      - autonomous/freshdesk-gorgias-decision-path
    paths:
      - .github/workflows/freshdesk-gorgias-editorial-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout editorial branch
        uses: actions/checkout@v7
        with:
          ref: autonomous/freshdesk-gorgias-decision-path

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add the verified ecommerce decision path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('data/seo/alternative-guides.ts')
          text = path.read_text()
          old = '''      { heading: "Simpler shared-inbox workflow", fit: "Help Scout is useful for teams prioritizing an inbox, knowledge base, and straightforward collaboration model.", alternativeSlug: "help-scout", comparisonSlug: "freshdesk-vs-help-scout" },
            ],
            evidenceSources: ["https://www.freshworks.com/freshdesk/pricing/", "https://www.freshworks.com/freshdesk/features/"],'''
          new = '''      { heading: "Simpler shared-inbox workflow", fit: "Help Scout is useful for teams prioritizing an inbox, knowledge base, and straightforward collaboration model.", alternativeSlug: "help-scout", comparisonSlug: "freshdesk-vs-help-scout" },
              { heading: "Ecommerce-specific customer context", fit: "Gorgias is the relevant route for ecommerce and Shopify support teams that need live order and customer data plus order actions inside the support conversation.", alternativeSlug: "gorgias", comparisonSlug: "freshdesk-vs-gorgias" },
            ],
            evidenceSources: ["https://www.freshworks.com/freshdesk/pricing/", "https://www.freshworks.com/freshdesk/features/", "https://www.gorgias.com"],'''
          if old not in text:
              raise SystemExit('Expected Freshdesk guide block not found; refusing a blind edit')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Alternative guide regression tests
        run: npm test -- tests/seo-factory/alternative-guides.test.ts tests/lib/alternative-decision-guide.test.ts

      - name: Validate data
        run: npm run validate:data

      - name: Full tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified editorial change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seo/alternative-guides.ts
          git commit -m "content: add Gorgias to Freshdesk decision guide"
          git push origin HEAD:autonomous/freshdesk-gorgias-decision-path
