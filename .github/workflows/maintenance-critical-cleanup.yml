name: One-time maintenance critical cleanup

on:
  push:
    branches:
      - autonomous/maintenance-critical-cleanup-2026-08-25
    paths:
      - .github/workflows/maintenance-critical-cleanup.yml
      - .github/scripts/maintenance-critical-cleanup.py

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: autonomous/maintenance-critical-cleanup-2026-08-25
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python .github/scripts/maintenance-critical-cleanup.py
      - run: npm test
      - run: npm run validate:data
      - run: npm run lint
      - run: npm run build
      - run: npm run maintenance
      - name: Print maintenance totals
        run: |
          node -e 'const s=require("./var/maintenance/latest-summary.json"); console.log("critical="+s.totalCritical+" warning="+s.totalWarning+" info="+s.totalInfo)'
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/revenue/affiliate-programs.ts data/software/keeper.json scripts/maintenance/social-channel-health.ts .github/workflows/maintenance.yml
          git commit -m "maintenance: repair stale critical findings"
          git push origin HEAD:autonomous/maintenance-critical-cleanup-2026-08-25
