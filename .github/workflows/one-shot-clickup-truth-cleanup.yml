name: One-shot ClickUp truth cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-clickup-truth-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reconcile ClickUp rejection in secondary truth layers
        run: |
          python - <<'PY'
          from pathlib import Path

          # partner-materials-audit: remove ClickUp from the generic pending map
          # and give it a first-party rejection record.
          audit = Path('data/affiliate/partner-materials-audit.ts')
          text = audit.read_text()
          old = '...[["FreshBooks", "freshbooks"], ["ClickUp", "clickup"], ["Wrike", "wrike"], ["Zendesk", "zendesk"]].map(([company, slug]) => record({ company: company!, slug: slug!, programNetwork: "PartnerStack", currentStatus: "PENDING", applicationStatus: "Under review", approvalStatus: "Not approved", readiness: "PENDING APPROVAL", evidence: [STATUS_DRAFT], lastVerifiedDate: "2026-08-19" })),'
          new = '...[["FreshBooks", "freshbooks"], ["Wrike", "wrike"], ["Zendesk", "zendesk"]].map(([company, slug]) => record({ company: company!, slug: slug!, programNetwork: "PartnerStack", currentStatus: "PENDING", applicationStatus: "Under review", approvalStatus: "Not approved", readiness: "PENDING APPROVAL", evidence: [STATUS_DRAFT], lastVerifiedDate: "2026-08-19" })),\n  record({ company: "ClickUp", slug: "clickup", programNetwork: "PartnerStack", currentStatus: "REJECTED", applicationStatus: "Rejected", approvalStatus: "Rejected", affiliateUrl: UNKNOWN, readiness: "REJECTED", evidence: ["First-party PartnerStack email dated 2026-08-21: After careful consideration, ClickUp has declined your application to join their program.", "data/affiliate/canonical-ledger.ts"], lastVerifiedDate: "2026-08-24" }),'          
          if text.count(old) != 1:
              raise SystemExit(f'Refusing audit patch: expected stale ClickUp pending map once, found {text.count(old)}')
          audit.write_text(text.replace(old, new, 1))

          # affiliate-programs is program research, but its ClickUp notes should
          # not imply the Miloosh relationship is still actionable after a real decline.
          programs = Path('data/revenue/affiliate-programs.ts')
          text = programs.read_text()
          marker = '    slug: "clickup",'
          start = text.index(marker)
          end = text.index('\n  {', start + len(marker))
          block = text[start:end]
          block = block.replace('    lastVerifiedAt: "2026-08-14",', '    lastVerifiedAt: "2026-08-24",', 1)
          notes_start = block.index('    notes:')
          sources_start = block.index('    sourceUrls:', notes_start)
          block = block[:notes_start] + (
              '    notes:\n'
              '      "RELATIONSHIP STATUS: REJECTED 2026-08-21. First-party PartnerStack email states that ClickUp declined Miloosh application. The public affiliate program still exists, but Miloosh must not be treated as pending/active or prioritized for re-application without a material new reason and new evidence.",\n'
          ) + block[sources_start:]
          programs.write_text(text[:start] + block + text[end:])
          PY

          git diff --check
          git diff -- data/affiliate/partner-materials-audit.ts data/revenue/affiliate-programs.ts

      - name: Install dependencies
        run: npm ci
      - name: Validate data
        run: npm run validate:data
      - name: Affiliate truth tests
        run: npx vitest run tests/lib/affiliate-integrity.test.ts tests/lib/canonical-affiliate-reconciliation-current-truth.test.ts
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/one-shot-clickup-truth-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/affiliate/partner-materials-audit.ts data/revenue/affiliate-programs.ts .github/workflows/one-shot-clickup-truth-cleanup.yml
          git commit -m "fix: remove ClickUp from stale pending truth layers"
          git push origin HEAD:main
